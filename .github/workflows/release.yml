name: Release
on:
  push: null
jobs:
  create-version:
    runs-on: ubuntu-latest
    name: Create version string
    outputs:
      new-version: ${{ steps.create-version.outputs.new-version }}
    steps:
    - name: Create version string
      id: create-version
      run: 'new_version=$(date +"%Y.%-m.%-d")

        echo "Releasing version: $new_version"

        echo "new-version=$new_version" >> $GITHUB_OUTPUT

        '
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Print all tags
      run: 'git tag

        '
    - name: Check
      run: "if [ $(git tag -l \"v${{ steps.create-version.outputs.new-version }}\") ]; then\n  echo \"\
        Version ${{ steps.create-version.outputs.new-version }} already exists!\"\n  exit 1\nelse\n  echo\
        \ \"Version ${{ steps.create-version.outputs.new-version }} does not exist\"\nfi\n"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.GH_REPO_TOKEN }}
    - name: Setup java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
    - name: Update version in code
      run: ./mvnw -B versions:set -DnewVersion="${{ steps.create-version.outputs.new-version }}" -DgenerateBackupPoms=false
    - name: Build
      run: ./mvnw -B package -Pcli --projects spotify-web-api-open-api --also-make
    - name: Update Open API
      run: ./scripts/patch-open-api.sh
    - name: Commit and tag
      run: 'git config user.name sonallux

        git config user.email 13821543+sonallux@users.noreply.github.com

        git add --update

        git commit -m "Bump version to ${{ steps.create-version.outputs.new-version }}"

        git tag "v${{ steps.create-version.outputs.new-version }}"

        '
    - name: Push
      run: 'git push --atomic origin main "v${{ steps.create-version.outputs.new-version }}"

        '
